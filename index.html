<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Familjens Planerare</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link href="https://googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">
  <script src="https://cloudflare.com"></script>
  <!-- Officiellt Supabase-skript för att hantera nya sb_publishable-nycklar -->
  <script src="https://jsdelivr.net"></script>

  <style>
    :root {
      --bg:#F0EDF8; --surface:#fff; --surface2:#F7F5FC; --border:#E4DEFC;
      --primary:#6C47E8; --primary-soft:#EDE8FC; --primary-glow:rgba(108,71,232,0.18);
      --emerald:#22C08A; --emerald-soft:#DCFDF2;
      --rose:#F05E7A; --rose-soft:#FDEDF0;
      --amber:#F59E0B; --amber-soft:#FEF3C7;
      --text:#1E1535; --text2:#7168A0; --text3:#A89FCE;
      --r:20px; --rsm:14px;
      --shadow:0 4px 24px rgba(108,71,232,0.10);
      --shadow-sm:0 2px 10px rgba(108,71,232,0.07);
      --font:'Nunito',sans-serif;
    }
    body.night {
      --bg:#211D42; --surface:#2C2761; --surface2:#373072; --border:#4B4392;
      --primary-soft:#3E3680; --emerald-soft:#123B2C; --rose-soft:#3D1826; --amber-soft:#3C2C00;
      --text:#F4F1FC; --text2:#BDB6E0; --text3:#8A82BE;
      --shadow:0 4px 24px rgba(0,0,0,0.22);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    .h{display:none !important}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden}
    .page{position:fixed;inset:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s;background:var(--bg)}
    .page.hidden{display:none}
    #pageDetail{transform:translateX(100%)}
    #pageDetail.open{transform:translateX(0)}
    .hdr{background:var(--surface);border-bottom:1.5px solid var(--border);padding:14px 18px 14px;position:sticky;top:0;z-index:40;display:flex;flex-direction:column;gap:10px}
    .hdr-toprow{display:flex;align-items:center;gap:12px}
    .hdr-logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#9B59E8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0;box-shadow:0 4px 14px var(--primary-glow)}
    .hdr-info{flex:1;min-width:0}
    .hdr-title{font-size:18px;font-weight:900;color:var(--text);line-height:1.1}
    .hdr-sub{font-size:12px;color:var(--text3);font-weight:600;margin-top:1px}
    .hdr-actions{display:flex;gap:6px}
    .icon-btn{width:46px;height:46px;border-radius:15px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:17px;position:relative;transition:background .2s,color .2s,transform .15s}
    .icon-btn:active{background:var(--primary-soft);color:var(--primary);transform:scale(.92)}
    .icon-btn svg{width:22px;height:22px;display:block}
    .bdg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:50%;background:var(--rose);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);padding:0 3px}
    .bdg.h{display:none}
    .date-row{display:flex;align-items:center;gap:8px;margin-top:2px}
    .date-block{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--rsm);padding:10px 14px;flex:1;cursor:pointer;user-select:none;transition:border-color .2s}
    .date-block:active{border-color:var(--primary)}
    .date-toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .date-cal-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);display:flex;align-items:center;gap:5px}
    .date-clock{font-size:26px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1}
    .date-main-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
    .date-text{font-size:15px;font-weight:700;color:var(--text2)}
    .date-text.farsi-rtl{direction:rtl}
    .date-redday{font-size:12px;font-weight:800;color:var(--rose);background:var(--rose-soft);padding:3px 9px;border-radius:50px;white-space:nowrap;flex-shrink:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;cursor:help}
    .date-redday:hover{max-width:100%;white-space:normal;word-break:break-word}
    .cal-btn{width:46px;height:46px;border-radius:15px;border:1.5px solid var(--border);background:var(--primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .2s;flex-shrink:0}
    .cal-btn:active{transform:scale(.92);opacity:.8}
    .dhdr{background:var(--surface);border-bottom:1.5px solid var(--border);padding:14px 18px;position:sticky;top:0;z-index:40;display:flex;flex-direction:column;gap:10px}
    .dhdr-toprow{display:flex;align-items:center;gap:10px}
    .back-btn{height:44px;padding:0 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text2);font-size:15px;font-weight:800;flex-shrink:0;transition:background .2s;font-family:var(--font)}
    .back-btn:active{background:var(--primary-soft);color:var(--primary)}
    .save-btn{height:44px;padding:0 14px;border-radius:14px;border:none;background:var(--emerald);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:800;flex-shrink:0;transition:opacity .2s,transform .1s;font-family:var(--font);box-shadow:0 4px 14px rgba(34,192,138,.25);white-space:nowrap}
    .save-btn:active{transform:scale(.96);opacity:.9}
    .pdf-btn{height:44px;padding:0 14px;border-radius:14px;border:none;background:var(--rose);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:800;flex-shrink:0;transition:opacity .2s,transform .1s;font-family:var(--font);box-shadow:0 4px 14px rgba(240,94,122,.25);white-space:nowrap}
    .pdf-btn:active{transform:scale(.96);opacity:.9}
    .mindmap-btn{height:44px;padding:0 14px;border-radius:14px;border:none;background:var(--primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:800;flex-shrink:0;transition:opacity .2s,transform .1s;font-family:var(--font);box-shadow:0 4px 14px var(--primary-glow);white-space:nowrap}
    .mindmap-btn:active{transform:scale(.96);opacity:.9}
    .mm-cat-list{display:flex;flex-direction:column;gap:8px}
    .mm-cat-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--rsm);background:var(--surface2);border:2px solid var(--border);cursor:pointer;transition:all .2s}
    .mm-cat-row:active{background:var(--primary-soft);border-color:var(--primary)}
    .mm-cat-name{font-size:15px;font-weight:800;color:var(--text)}
    .mm-cat-date{font-size:12px;color:var(--text3);font-weight:600;margin-top:2px}
    .mm-cat-count{font-size:13px;font-weight:900;color:#fff;background:var(--primary);padding:4px 12px;border-radius:50px;min-width:26px;text-align:center}
    .mm-sticky-header{text-align:center;margin-bottom:16px}
    .mm-sticky-title{font-size:19px;font-weight:900;color:var(--text)}
    .mm-sticky-date{font-size:13px;font-weight:700;color:var(--primary);margin-top:2px}
    .mm-sticky-sub{font-size:12px;color:var(--text3);font-weight:600;margin-top:4px}
    .mm-note-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:6px 4px 20px}
    .mm-note{border-radius:2px;min-height:130px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:'Caveat',cursive;font-size:24px;font-weight:700;color:#2b2410;box-shadow:0 10px 18px rgba(0,0,0,.2);word-break:break-word;line-height:1.2;transition:transform .15s}
    .mm-note[onclick]{cursor:pointer}
    .mm-note[onclick]:active{transform:scale(.96) rotate(0deg) !important}
    .mm-note-badges{font-family:var(--font);font-size:12px;color:#2b2410;opacity:.7;margin-top:8px;display:flex;gap:8px}
    .mm-note-text{width:100%}
    .mm-note-person{font-family:var(--font);font-size:11px;font-weight:800;color:#2b2410;opacity:.65;margin-top:8px;text-transform:uppercase;letter-spacing:.03em}
    .mm-empty{text-align:center;padding:30px 16px;color:var(--text3);font-weight:700;grid-column:1/-1}
    .algo-map-scroll{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:6px 0 12px;display:flex;justify-content:center}
    .algo-map-wrap{position:relative;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#132048 0%,#0a1330 45%,#04070f 78%,#020308 100%);border:1px solid rgba(120,190,255,.3);box-shadow:0 0 50px rgba(40,110,255,.28),inset 0 0 70px rgba(0,0,0,.65)}
    .algo-map-wrap::before{content:'';position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.4px);background-size:24px 24px;opacity:.45;pointer-events:none}
    .algo-ring{position:absolute;border:1px solid rgba(130,195,255,.32);border-radius:50%;box-shadow:0 0 12px rgba(90,165,255,.22),inset 0 0 12px rgba(90,165,255,.12);pointer-events:none}
