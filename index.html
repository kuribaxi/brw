      .sync-section{padding:16px 18px 0}
      .sync-card{background:var(--surface);border-radius:var(--r);border:1.5px solid var(--border);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:12px}
      .sync-card .sync-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
      .sync-card .sync-header i{font-size:20px;color:var(--primary)}
      .sync-card .sync-title{font-size:15px;font-weight:900;color:var(--text)}
      .sync-card .sync-sub{font-size:13px;color:var(--text2);margin-top:2px}
      .sync-card .sync-status{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-top:8px}
      .sync-card .sync-status-dot{width:8px;height:8px;border-radius:50%;background:var(--text3)}
      .sync-card .sync-status-dot.online{background:var(--emerald)}
      .sync-card .sync-status-dot.offline{background:var(--amber)}
      .sync-card .sync-status-dot.error{background:var(--rose)}
      .sync-card .sync-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
      .sync-card .sync-actions button{height:40px;padding:0 16px;border-radius:10px;border:none;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
      .sync-card .sync-actions .sync-btn-primary{background:var(--primary);color:#fff}
      .sync-card .sync-actions .sync-btn-secondary{background:var(--surface2);color:var(--text2);border:1.5px solid var(--border)}
      .sync-card .sync-actions .sync-btn-danger{background:var(--rose-soft);color:var(--rose)}
      .sync-input{width:100%;height:44px;border-radius:var(--rsm);border:2px solid var(--border);background:var(--surface2);padding:0 14px;font-family:var(--font);font-size:14px;font-weight:600;color:var(--text);outline:none;margin-top:8px;transition:border .2s}
      .sync-input:focus{border-color:var(--primary)}
      .sync-log{background:var(--surface2);border-radius:var(--rsm);padding:10px 12px;margin-top:10px;max-height:120px;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:12px;font-family:monospace;color:var(--text2);line-height:1.5}
      .sync-log .log-entry{padding:2px 0;border-bottom:1px solid var(--border)}
      .sync-log .log-time{color:var(--text3);font-size:11px}
      .sync-log .log-success{color:var(--emerald)}
      .sync-log .log-error{color:var(--rose)}
      .sync-log .log-info{color:var(--primary)}
      body.locked > .page,body.locked > .bot-nav{display:none}
      .login-ov{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px}
      .login-ov.h{display:none}
      .login-card{width:100%;max-width:360px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:32px 24px;box-shadow:var(--shadow);text-align:center}

      .login-title{font-size:19px;font-weight:900;color:var(--text)}
      .login-sub{font-size:13px;color:var(--text3);font-weight:600;margin-top:4px;margin-bottom:20px}
      .login-input{width:100%;height:54px;border-radius:var(--rsm);border:2px solid var(--border);background:var(--surface2);padding:0 16px;font-family:var(--font);font-size:17px;font-weight:700;color:var(--text);outline:none;text-align:center;letter-spacing:2px;transition:border .2s}
      .login-input:focus{border-color:var(--primary)}
      .login-err{font-size:13px;font-weight:700;color:var(--rose);margin-top:10px}
      .login-err.h{display:none}
