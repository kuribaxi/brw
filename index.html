<!-- ===== SYNC SECTION (ERSATT MED QR-KODSYNK) ===== -->
<div class="sync-section" id="syncSection">
  <div class="sync-card">
    <div class="sync-header">
      <i class="fas fa-qrcode"></i>
      <div>
        <div class="sync-title">Synkronisering med QR-kod</div>
        <div class="sync-sub">Dela och synka data mellan enheter</div>
      </div>
    </div>
    <div class="sync-status">
      <span class="sync-status-dot" id="syncStatusDot" style="background: var(--emerald);"></span>
      <span id="syncStatusText">Lokal lagring aktiv</span>
    </div>
    <div class="sync-actions">
      <button class="sync-btn-primary" onclick="generateQRCode()">
        <i class="fas fa-qrcode"></i> Generera QR-kod
      </button>
      <button class="sync-btn-secondary" onclick="scanQRCode()">
        <i class="fas fa-camera"></i> Skanna QR-kod
      </button>
      <button class="sync-btn-secondary" onclick="exportLocalBackup()">
        <i class="fas fa-download"></i> Exportera backup
      </button>
      <button class="sync-btn-secondary" onclick="importLocalBackup()">
        <i class="fas fa-upload"></i> Importera backup
      </button>
    </div>
  </div>
</div>

<!-- ===== QR-KOD MODAL ===== -->
<div class="modal-ov h" id="qrModal" onclick="if(event.target===this)closeQRModal()">
  <div class="modal-sheet" style="max-width: 500px;">
    <div class="modal-handle"></div>
    <div class="modal-hdr">
      <div class="modal-ttl">
        <i class="fas fa-qrcode" style="color: var(--primary);"></i> Synk med QR-kod
      </div>
      <button class="modal-x" onclick="closeQRModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body" id="qrModalBody" style="padding: 20px; text-align: center;">
      <!-- QR-kod kommer att genereras här -->
      <div id="qrCodeContainer" style="margin: 20px auto;"></div>
      <div id="qrInstructions" style="color: var(--text2); font-size: 14px; margin-top: 10px;">
        Visa denna QR-kod för andra enheter att skanna.
      </div>
    </div>
    <div class="modal-ftr">
      <button class="modal-btn mbtn-neutral" onclick="closeQRModal()">Stäng</button>
    </div>
  </div>
</div>

<!-- ===== SCANNER MODAL ===== -->
<div class="modal-ov h" id="scannerModal" onclick="if(event.target===this)closeScannerModal()">
  <div class="modal-sheet" style="max-width: 500px;">
    <div class="modal-handle"></div>
    <div class="modal-hdr">
      <div class="modal-ttl">
        <i class="fas fa-camera" style="color: var(--primary);"></i> Skanna QR-kod
      </div>
      <button class="modal-x" onclick="closeScannerModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body" style="padding: 20px; text-align: center;">
      <div id="scannerContainer" style="margin: 20px auto;"></div>
      <div style="color: var(--text2); font-size: 14px; margin-top: 10px;">
        Pejla en QR-kod från en annan enhet för att synka data.
      </div>
    </div>
    <div class="modal-ftr">
      <button class="modal-btn mbtn-neutral" onclick="closeScannerModal()">Stäng</button>
    </div>
  </div>
</div>
