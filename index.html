<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Familjens Planerare - FINAL</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#F0EDF8;color:#1E1535;min-height:100vh}
.h{display:none!important}
.login-ov{position:fixed;inset:0;background:#F0EDF8;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.login-card{background:#fff;border:2px solid #E4DEFC;border-radius:20px;padding:28px 20px;width:100%;max-width:380px}
.input{width:100%;height:56px;border-radius:14px;border:2px solid #E4DEFC;background:#F7F5FC;padding:0 16px;font-size:16px;font-weight:700;outline:none;color:#1E1535;margin-bottom:10px;font-family:Nunito,sans-serif}
.input:focus{border-color:#6C47E8;background:#fff}
.btn{width:100%;height:56px;border-radius:14px;border:none;background:#6C47E8;color:#fff;font-weight:800;font-size:16px;cursor:pointer;font-family:Nunito,sans-serif}
.btn:active{transform:scale(0.98)}
.btn-sec{width:100%;height:46px;border-radius:12px;border:1.5px solid #E4DEFC;background:#F7F5FC;color:#7168A0;font-weight:700;cursor:pointer;margin-top:8px;font-family:Nunito,sans-serif}
.profile-row{display:flex;gap:8px;margin-bottom:10px}
.profile-btn{flex:1;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:2px solid #E4DEFC;background:#F7F5FC;cursor:pointer;font-weight:800;text-align:left;color:#1E1535;font-family:Nunito,sans-serif}
.profile-del{width:46px;height:46px;border-radius:12px;border:1.5px solid #E4DEFC;background:#F7F5FC;cursor:pointer;font-size:20px}
.page{position:fixed;inset:0;overflow-y:auto;background:#F0EDF8}
.hdr{background:#fff;border-bottom:1.5px solid #E4DEFC;padding:12px;position:sticky;top:0;z-index:40;display:flex;flex-direction:column;gap:10px}
.hdr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#6C47E8,#9B59E8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0}
.hdr-actions{display:flex;gap:6px;flex-wrap:wrap}
.icon-btn{width:44px;height:44px;border-radius:13px;border:1.5px solid #E4DEFC;background:#F7F5FC;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.save-btn{height:44px;padding:0 14px;border-radius:13px;border:none;background:#22C08A;color:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
.date-row{display:flex;gap:8px}
.date-block{background:#F7F5FC;border:1.5px solid #E4DEFC;border-radius:14px;padding:10px 14px;flex:1}
.sync-card{background:#fff;border-radius:20px;border:1.5px solid #E4DEFC;padding:16px;margin:16px}
.sync-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sync-actions button{height:40px;padding:0 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:Nunito,sans-serif}
.primary{background:#6C47E8;color:#fff}
.secondary{background:#F7F5FC;color:#7168A0;border:1.5px solid #E4DEFC}
.cards{padding:0 16px}
.pcard{background:#fff;border-radius:20px;border:2px solid #E4DEFC;padding:16px;margin-bottom:12px;cursor:pointer}
.avatar{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px;margin-bottom:8px}
.task-item{display:flex;gap:10px;padding:11px 10px;border-radius:14px;background:#fff;border:1.5px solid #E4DEFC;margin-bottom:8px}
.check{width:36px;height:36px;border-radius:11px;border:2.5px solid #E4DEFC;background:#F7F5FC;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:85vh;display:flex;flex-direction:column}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1.5px solid #E4DEFC}
.toast{position:fixed;bottom:20px;left:16px;right:16px;background:#1E1535;color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;z-index:9999;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>

<div class="login-ov" id="loginOv">
  <div class="login-card">
    <div style="text-align:center">
      <div style="font-size:48px">👥</div>
      <div style="font-weight:900;font-size:22px;margin-top:8px">Familjens Planerare</div>
      <div style="font-size:13px;color:#7168A0;margin-top:6px">Välj profil eller skapa ny</div>
    </div>
    <div id="profileList" style="margin-top:18px"></div>
    <div style="margin-top:18px;border-top:1.5px solid #E4DEFC;padding-top:16px">
      <div style="font-weight:800;font-size:14px;margin-bottom:10px">➕ Skapa ny profil</div>
      <input type="text" id="pName" class="input" placeholder="Namn t.ex. Mamma" maxlength="20">
      <input type="password" id="pPw" class="input" placeholder="Lösenord">
      <input type="password" id="pPw2" class="input" placeholder="Bekräfta lösenord">
      <div id="pErr" style="display:none;color:#F05E7A;font-size:13px;font-weight:700;margin-bottom:10px;text-align:center"></div>
      <button class="btn" onclick="createProfile()">Skapa profil</button>
    </div>
    <button class="btn-sec" onclick="clearAll()">🧹 Rensa allt (om fel)</button>
  </div>
</div>

<div class="page" id="pageHome">
  <header class="hdr">
    <div class="hdr-top">
      <div class="logo">📋</div>
      <div style="flex:1"><div style="font-weight:900;font-size:18px">Familjens Planerare</div><div id="who" style="font-size:12px;color:#A89FCE"></div></div>
      <div class="hdr-actions">
        <button class="save-btn" onclick="saveAll()">💾 Spara</button>
        <button class="icon-btn" onclick="toggleNight()">🌙</button>
        <button class="icon-btn" onclick="logout()">🚪</button>
      </div>
    </div>
    <div class="date-row">
      <div class="date-block"><span id="clock" style="font-size:22px;font-weight:900">00:00</span><div id="date" style="font-size:13px;color:#7168A0;font-weight:700"></div></div>
    </div>
  </header>

  <div style="max-width:600px;margin:0 auto;padding-bottom:100px">
    <div style="padding:16px"><div style="display:flex;gap:8px"><input id="newPerson" placeholder="Lägg till person…" maxlength="20" style="flex:1;height:52px;border-radius:14px;border:2px solid #E4DEFC;padding:0 16px;font-size:16px;font-weight:700;outline:none"><button onclick="addPerson()" style="height:52px;padding:0 20px;border-radius:14px;border:none;background:#6C47E8;color:#fff;font-weight:800;cursor:pointer">➕</button></div></div>
    <div class="cards" id="cards"></div>

    <div class="sync-card">
      <div style="display:flex;gap:10px;align-items:center"><span style="font-size:20px">🔗</span><div><div style="font-weight:900">QR-synk – 100% offline</div><div style="font-size:13px;color:#7168A0">Ingen molntjänst</div></div></div>
      <div style="background:#EDE8FC;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;color:#7168A0;border:1.5px solid #E4DEFC">📱 Visa QR på enhet 1 → Scanna på enhet 2</div>
      <div class="sync-actions">
        <button class="primary" onclick="showQR()">📤 Visa min QR</button>
        <button class="secondary" onclick="scanQR()">📷 Scanna QR</button>
        <button class="secondary" onclick="exportFile()">💾 Fil</button>
        <button class="secondary" onclick="importFile()">📂 Import</button>
      </div>
      <div id="syncLog" style="font-size:12px;margin-top:10px;font-family:monospace;color:#7168A0"></div>
    </div>
  </div>
</div>

<div class="modal-ov h" id="qrModal" onclick="if(event.target===this)closeQR()"><div class="modal-sheet"><div class="modal-hdr"><div style="font-weight:900">🔗 QR-synk</div><button onclick="closeQR()" style="width:36px;height:36px;border-radius:10px;border:none;background:#F7F5FC;cursor:pointer">✕</button></div><div style="padding:16px;text-align:center"><div id="qrBox" style="display:flex;justify-content:center;margin-bottom:12px"></div><div id="qrInfo" style="font-size:13px;color:#7168A0;font-weight:700"></div><div id="qrScan" style="width:100%;max-width:360px;margin:0 auto"></div><div id="qrRes" style="margin-top:12px"></div></div><div style="padding:12px;border-top:1.5px solid #E4DEFC"><button onclick="closeQR()" style="width:100%;height:52px;border-radius:14px;border:none;background:#F7F5FC;font-weight:800;cursor:pointer">Stäng</button></div></div></div>

<div class="toast" id="toast"></div>

<script>
const COLORS=['#6C47E8','#22C08A','#F05E7A','#F59E0B','#0EA5E9','#EC4899'];
function get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
let tasks=get('familyTasks',[]);
let persons=get('familyPersons',['person1','person2','person3']);
let labels=get('familyPersonLabels',{person1:'Person 1',person2:'Person 2',person3:'Person 3'});
let trash=get('familyTrash',[]);
function saveAllData(){localStorage.setItem('familyTasks',JSON.stringify(tasks));localStorage.setItem('familyPersons',JSON.stringify(persons));localStorage.setItem('familyPersonLabels',JSON.stringify(labels));localStorage.setItem('familyTrash',JSON.stringify(trash));}
function profiles(){try{const v=localStorage.getItem('familyProfiles');return v?JSON.parse(v).filter(p=>p&&p.id&&p.name):[];}catch{return []}}
function saveProfiles(p){localStorage.setItem('familyProfiles',JSON.stringify(p))}
let currentId=localStorage.getItem('familyCurrentProfileId');
let tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),3000);}
function renderProfiles(){
  const list=document.getElementById('profileList');
  if(!list) return;
  const ps=profiles();
  if(ps.length===0){
    list.innerHTML='<div style="text-align:center;padding:12px;background:#F7F5FC;border-radius:12px;border:1.5px dashed #E4DEFC;color:#7168A0;font-size:13px;font-weight:700">Inga profiler – skapa en nedan 👇</div>';
    return;
  }
  if(currentId && ps.find(p=>p.id===currentId)){
    document.getElementById('loginOv').style.display='none';
    const who=document.getElementById('who');
    if(who) who.textContent='Inloggad som '+ps.find(p=>p.id===currentId).name;
    return;
  }
  list.innerHTML='<div style="font-weight:800;font-size:13px;margin-bottom:10px">Välj profil:</div>'+ps.map(p=>'<div class="profile-row"><button class="profile-btn" onclick="login(\''+p.id+'\')"><span style="width:36px;height:36px;border-radius:12px;background:#6C47E8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900">'+p.name.charAt(0).toUpperCase()+'</span><span>'+p.name+'</span><span style="margin-left:auto">➡️</span></button><button class="profile-del" onclick="delProf(\''+p.id+'\')">🗑️</button></div>').join('');
}
function login(id){
  const p=profiles().find(x=>x.id===id);
  if(!p) return;
  const pw=prompt('Lösenord för '+p.name+':');
  if(pw===null) return;
  if(pw===p.password){
    currentId=id;
    localStorage.setItem('familyCurrentProfileId',id);
    document.getElementById('loginOv').style.display='none';
    document.getElementById('who').textContent='Inloggad som '+p.name;
    toast('Välkommen '+p.name+'!');
    renderCards();
  }else{alert('Fel lösenord');}
}
function createProfile(){
  const nameEl=document.getElementById('pName');
  const pwEl=document.getElementById('pPw');
  const pw2El=document.getElementById('pPw2');
  const err=document.getElementById('pErr');
  const name=(nameEl.value||'').trim();
  const pw=pwEl.value||'';
  const pw2=pw2El.value||'';
  if(err) err.style.display='none';
  if(!name){if(err){err.textContent='Skriv ett namn';err.style.display='block'}return}
  if(name.length<2){if(err){err.textContent='Minst 2 bokstäver';err.style.display='block'}return}
  if(!pw){if(err){err.textContent='Skriv ett lösenord';err.style.display='block'}return}
  if(pw!==pw2){if(err){err.textContent='Lösenorden matchar inte';err.style.display='block'}return}
  const ps=profiles();
  const np={id:'p_'+Date.now(),name:name,password:pw};
  ps.push(np);
  saveProfiles(ps);
  currentId=np.id;
  localStorage.setItem('familyCurrentProfileId',np.id);
  document.getElementById('loginOv').style.display='none';
  const who=document.getElementById('who');
  if(who) who.textContent='Inloggad som '+name;
  toast('Profil skapad! Välkommen '+name);
  renderCards();
  nameEl.value='';pwEl.value='';pw2El.value='';
}
function delProf(id){
  if(!confirm('Ta bort profilen?')) return;
  let ps=profiles().filter(p=>p.id!==id);
  saveProfiles(ps);
  if(currentId===id){currentId=null;localStorage.removeItem('familyCurrentProfileId');}
  renderProfiles();
  toast('Borttagen');
}
function logout(){if(confirm('Logga ut?')){localStorage.removeItem('familyCurrentProfileId');location.reload();}}
function clearAll(){if(confirm('Rensa ALL data?')){localStorage.clear();location.reload();}}
function renderCards(){
  const el=document.getElementById('cards');
  if(!el) return;
  function count(pid){const m=pid==='all'?tasks:tasks.filter(t=>t.person===pid);return {a:m.filter(t=>!t.done).length,d:m.filter(t=>t.done).length}}
  let h='';
  const all=count('all');
  h+='<div class="pcard" onclick="openPerson(\'all\')"><div class="avatar" style="background:'+COLORS[0]+'">👥</div><div style="font-weight:900">Alla</div><div style="font-size:12px;color:#7168A0;margin-top:6px">📋 '+all.a+' att göra · ✅ '+all.d+' klara</div></div>';
  persons.forEach((pid,i)=>{
    const c=count(pid);
    const col=COLORS[(i+1)%COLORS.length];
    const label=labels[pid]||pid;
    h+='<div class="pcard" onclick="openPerson(\''+pid+'\')"><div class="avatar" style="background:'+col+'">'+label.charAt(0).toUpperCase()+'</div><div style="font-weight:900">'+label+'</div><div style="font-size:12px;color:#7168A0;margin-top:6px">📋 '+c.a+' · ✅ '+c.d+'</div></div>';
  });
  el.innerHTML=h;
}
function addPerson(){
  const inp=document.getElementById('newPerson');
  const name=(inp.value||'').trim();
  if(!name){toast('Skriv ett namn');return}
  const id='person'+Date.now();
  persons.push(id);
  labels[id]=name;
  saveAllData();
  renderCards();
  inp.value='';
  toast('Tillagd!');
}
function openPerson(id){
  const label=id==='all'?'Alla':(labels[id]||id);
  const mine=id==='all'?tasks:tasks.filter(t=>t.person===id);
  const text=mine.map(t=>(t.done?'✅':'☐')+' '+t.text).join('\\n')||'Inga uppgifter';
  const newTask=prompt(label+'\\n\\nUppgifter:\\n'+text+'\\n\\nSkriv ny uppgift (eller avbryt):');
  if(newTask && newTask.trim()){
    tasks.push({id:Date.now(),text:newTask.trim(),time:'idag',person:id,done:false});
    saveAllData();
    renderCards();
    toast('Tillagd!');
  }
}
function saveAll(){saveAllData();toast('✅ Sparat!')}
function updateClock(){
  const now=new Date();
  const c=document.getElementById('clock');
  const d=document.getElementById('date');
  if(c) c.textContent=now.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
  if(d) d.textContent=now.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'});
}
let html5Qr=null;
function showQR(){
  try{
    const payload={tasks,persons,labels,trash,v:1,t:Date.now()};
    const json=JSON.stringify(payload);
    let comp;
    if(typeof LZString!=='undefined' && LZString.compressToEncodedURIComponent){comp=LZString.compressToEncodedURIComponent(json);}else{comp=btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
    const box=document.getElementById('qrBox');
    const info=document.getElementById('qrInfo');
    document.getElementById('qrScan').innerHTML='';document.getElementById('qrRes').innerHTML='';box.innerHTML='';
    if(comp.length>2500){info.innerHTML='⚠️ För stor för QR ('+comp.length+'). Använd Fil.';document.getElementById('qrModal').classList.remove('h');return}
    info.textContent='Visar '+tasks.length+' uppgifter – låt andra scanna';
    document.getElementById('qrModal').classList.remove('h');
    setTimeout(()=>{if(typeof QRCode==='undefined'){info.textContent='Laddar QR... försök igen om 2 sek';return}new QRCode(box,{text:comp,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});},200);
  }catch(e){toast('QR-fel: '+e.message)}
}
function scanQR(){
  document.getElementById('qrBox').innerHTML='';document.getElementById('qrInfo').textContent='Peka kameran mot QR-koden';document.getElementById('qrRes').innerHTML='';document.getElementById('qrModal').classList.remove('h');
  setTimeout(()=>{
    try{
      const qr=new Html5Qrcode("qrScan");html5Qr=qr;
      qr.start({facingMode:"environment"},{fps:10,qrbox:250},(decoded)=>{
        qr.stop().then(()=>{
          try{
            let dec;
            if(typeof LZString!=='undefined' && LZString.decompressFromEncodedURIComponent){dec=LZString.decompressFromEncodedURIComponent(decoded);}else{let t=decoded.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';dec=decodeURIComponent(escape(atob(t)));}
            if(!dec) throw new Error('Kunde inte packa upp');
            const remote=JSON.parse(dec);
            if(!remote.tasks) throw new Error('Ogiltig data');
            if(!confirm('Hämta '+remote.tasks.length+' uppgifter?')) return;
            tasks=remote.tasks||[];persons=remote.persons||persons;labels=remote.labels||labels;trash=remote.trash||[];
            saveAllData();renderCards();
            document.getElementById('qrRes').innerHTML='<div style="background:#DCFDF2;color:#22C08A;padding:10px;border-radius:10px;font-weight:800">✅ Hämtat '+tasks.length+'!</div>';
            toast('✅ Hämtat via QR!');setTimeout(closeQR,1500);
          }catch(e){document.getElementById('qrRes').innerHTML='<div style="background:#FDEDF0;color:#F05E7A;padding:10px;border-radius:10px">❌ '+e.message+'</div>'}
        });
      },()=>{}).catch(e=>{document.getElementById('qrRes').innerHTML='Kamera-fel: '+e});
    }catch(e){document.getElementById('qrRes').innerHTML='Fel: '+e.message}
  },200);
}
function closeQR(){if(html5Qr){try{html5Qr.stop()}catch(e){}html5Qr=null}document.getElementById('qrModal').classList.add('h');document.getElementById('qrScan').innerHTML='';document.getElementById('qrBox').innerHTML='';}
function exportFile(){const backup={tasks,persons,labels,trash,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='familj-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('✅ Fil sparad!');}
function importFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const b=JSON.parse(ev.target.result);if(!b.tasks){toast('Ogiltig fil');return}if(!confirm('Ersätta all data med filen ('+b.tasks.length+' uppgifter)?'))return;tasks=b.tasks||[];persons=b.persons||persons;labels=b.labels||labels;trash=b.trash||[];saveAllData();renderCards();toast('✅ Import klar!');}catch(err){toast('❌ Kunde inte läsa')}};r.readAsText(f);};inp.click();}
function init(){renderProfiles();updateClock();setInterval(updateClock,1000);renderCards();}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
</script>
</body>
</html>
